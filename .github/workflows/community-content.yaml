name: Create Community Content

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "src/content/resources/**.json"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate community content
    if: ${{ github.repository_owner == 'astrolicious' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push generated community content commits
      pull-requests: write # update community content PRs

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          # vars.BOT_APPID stores the numeric App ID
          # jactionlint ignore=deprecated-action-input
          app-id: ${{ vars.BOT_APPID }}
          # jactionlint ignore=secrets-outside-env
          private-key: ${{ secrets.BOT_SECRET }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Generate MDX content
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: generator
        env:
          WORKSPACE: ${{ github.workspace }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { default: script } = await import(`${process.env.WORKSPACE}/.github/scripts/mdx.js`)
            await script({github, context, core})

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "astrolicious[bot]"
            git config user.email "168325803+astrolicious[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[ci] update community content"
            git push
          fi
