name: Format

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format with Biome
    if: ${{ github.repository_owner == 'astrolicious' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push formatted commits back to the branch

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          # vars.BOT_APPID stores the numeric App ID
          # jactionlint ignore=deprecated-action-input
          app-id: ${{ vars.BOT_APPID }}
          # jactionlint ignore=secrets-outside-env
          private-key: ${{ secrets.BOT_SECRET }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint and format code with Biome
        run: pnpm run format

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[ci] lint"
            git push
          fi
